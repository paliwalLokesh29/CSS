<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .container{
            border: 2px solid black;
            background-color: antiquewhite;
            display: flex;
            flex-direction: row;
            width: 400px;
            padding: 2px;
            margin: 10px;
        }
        #boxleft{
            background-color: aqua;
            border: 1px solid brown;
            width: 47%;
            margin: 3px;
            padding: 2px;
            flex-direction: column;
        }
        #boxright{
            background-color: red;
            border: 1px solid black;
             margin: 3px;
            padding: 2px;
            width: 200px;
        }
        p{
            border: 2px solid black;
        }
        img{
           width: 200px;
        }
        @media (max-width:640px){
            .container{
                flex-direction:column;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div id="boxleft
        ">
            <p>TEXT1</p>
            <p>TEXt2</p>
        </div>
        <div id="boxright">
            <img src="image.jpg" >
        </div>
    </div>
</body>
</html>
