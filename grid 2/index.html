<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body{
            width: 100%;
            height: 100%;
        }
        .container{
            display: grid;
            gap: 1rem;
            padding: 4rem;
            width: 100%;
            height: 100%;
            background-color: grey;
            /* grid-template-columns: repeat(3, 1fr); */
            /* grid-template-columns: repeat(auto-fit, minmax(200px, 500px)); */
            grid-template-areas: 
            "header header header"
            "sidebar content1 content1"
            "sidebar content2 content3"
            "footer footer footer"
            ;
            
        }
        .item{
            border: 3px solid black;
            background-color: rgb(57, 17, 112);
            color: white;
            padding: 1rem;

        }
        #header{
            grid-area: header;
        }
        #sidebar{
            grid-area: sidebar;       }
        #content1{
             grid-area: content1;   
        }
         #content2{
            grid-area: content2;
         }
          #content3{
            grid-area: content3;
          }
          #footer{
            grid-area: footer;
          }

    </style>
</head>
<body>
    <div class="container">
        <div class="item " id="header">A</div>
        <div class="item" id="sidebar">B</div>
        <div class="item"id="content1">C</div>
        <div class="item" id="content2">d</div>
        <div class="item" id="content3">E</div>
        <div class="item" id="footer">F</div>
        
    </div>
</body>
</html>
