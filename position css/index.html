<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        div{
            border: 2px solid brown;
        }
        .container{
            background-color: aqua;
            height: 10000px;
        }
        .box{
            background-color: pink;
            height: 4000px;
        }
        img{
            margin: 10px;
        }
        /* relative position is used for move imag top, left, right, down
        absolute position is used relative to its closed positioned ancestor
        fixed position is used whrn we scroll the page the img are not fixed its postion
        sticky is used same as fixed but differnce is sticky image move to its parents height */
        .image2{
          position: relative;
          position: sticky;
          top: 100px;
        }
        .image3{
            position : absolute;
            top: 100px;
        }
        .image4{
            position: fixed;
        }
        

        
    </style>
    <title>Document</title>
</head>
<body>
    <div class="container">
        <img src="image_1.jpg" 
        alt="poster 1"
        width="300px"
        height="300px"
        class="image1"
        >

        <img src="image2.jpg" 
        alt="poster 2"
        width="300px"
        height="300px"
        class="image2">

        <img src="image3.jpg" 
        alt="poster 3"
        width="300px"
        height="300px"
        class="image3">

        <img src="image4.jpg" 
        alt="poster 4"
        width="300px"
        height="300px"
        class="image4">
    </div>
    <div class="box">

    </div>
</body>
</html>
